name: Build Starl APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o Starl_Android_Project_With_Widget.zip -d project
          find project -name gradlew

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Starl-APK
          path: project/app/build/outputs/apk/debug/*.apk
