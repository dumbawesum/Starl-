name: Build Starl APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: project
        run: |
          WRAPPER=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No gradlew found. Extract and upload the ZIP contents."
            exit 1
          fi
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: .
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
