name: Build Starl APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o Starl_Android_Project_With_Widget.zip -d project

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
